[package]
name = "blitz-paint"
description = "Paint a Blitz Document using anyrender"
documentation = "https://docs.rs/blitz-paint"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["svg"]
tracing = ["dep:tracing"]
svg = ["dep:usvg", "blitz-dom/svg", "dep:anyrender_vello_cpu", "dep:vello_common", "dep:vello_cpu"]
custom-widget = ["blitz-dom/custom-widget"]
font-embolden = []
apple-font-embolden = []
# Paint overlay scrollbar thumbs on scroll containers, and enable their
# drag/hover interaction in blitz-dom (off by default while the feature
# matures).
scrollbars = ["blitz-dom/scrollbars"]

[dependencies]
# Blitz dependencies
anyrender = { workspace = true }
blitz-traits = { workspace = true }
blitz-dom = { workspace = true }

# Servo dependencies
style = { workspace = true }
euclid = { workspace = true }

# DioxusLabs dependencies
taffy = { workspace = true }

# Linebender + WGPU dependencies
parley = { workspace = true, features = ["bytemuck"] }
skrifa = { workspace = true }
color = { workspace = true }
peniko = { workspace = true }
kurbo = { workspace = true }
usvg = { workspace = true, optional = true }

# Other dependencies
bytemuck = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true, optional = true }

# SVG image filters use the same bounded CPU graph as Canvas SVG filters.
[dependencies.anyrender_vello_cpu]
workspace = true
optional = true

[dependencies.vello_common]
version = "0.1"
default-features = false
features = ["std"]
optional = true

[dependencies.vello_cpu]
version = "0.1"
default-features = false
features = ["std", "text", "u8_pipeline"]
optional = true

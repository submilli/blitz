[package]
name = "blitz-html"
description = "Blitz HTML parser"
documentation = "https://docs.rs/blitz-html"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
accessibility = ["blitz-dom/accessibility"]
tracing = ["dep:tracing", "blitz-dom/tracing"]

[dependencies]
encoding_rs = "0.8"
# Blitz dependencies
blitz-dom = { workspace = true }
blitz-traits = { workspace = true }

# Servo dependencies
html5ever = { workspace = true }
xml5ever = { workspace = true }

tracing = { workspace = true, optional = true }

[dev-dependencies]
# SVG images (with WOFF2 test fonts) for tests/svg_fonts.rs, and the
# accessibility tree for tests/accessibility.rs
blitz-dom = { workspace = true, features = ["svg", "woff", "accessibility"] }
keyboard-types = { workspace = true }
accesskit = { workspace = true }

# Exercise raw selector AST admission independently of Blitz string parsing.
style = { workspace = true }
style_config = { workspace = true }
